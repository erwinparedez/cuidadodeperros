<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mascotas Web</title>
    <link rel="icon" type="image/webp" href="./src/icon-a.webp">
    <link rel="stylesheet" href="styles/index.css">
    <link rel="stylesheet" href="styles/navbar.css">
    <link rel="stylesheet" href="styles/canvas.css">
    <link rel="stylesheet" href="styles/instrucciones.css">
    <link rel="stylesheet" href="styles/configuraciones.css">
    <link rel="stylesheet" href="styles/menu.css">
    <link rel="stylesheet" href="styles/custom.css">
</head>

<section class="pantalla-no-disponible">
    <img src="./src/gameover-a.webp" alt="No disponible en móvil" class="img-no-disponible">
    <h2 class="titulo-no-disponible">Lo sentimos</h2>
    <p class="texto-no-disponible">Solo disponible para computadoras</p>
</section>

<body>
    <!-- BARRA DE NAVEGACIÓN -->
    <nav id="navbar-box">
        <div class="nav-menu icono-item">
            <button class="btn-nav" id="btn-nav1"><img src="./src/arrow-icon.webp" alt="icono"></button>
            <span class="text-font">Volver</span>
        </div>

        <div class="nav-config">
            <div class="icono-item">
                <button class="btn-nav" id="btn-nav2"><img src="./src/help-icon.webp" alt="icono"></button>
                <span class="text-font">Instrucciones</span>
            </div>
            <div class="icono-item audio-btn">
                <button id="btn-nav3"><img src="./src/music-icon.webp" alt="icono"></button>
                <span class="text-font">Con Música</span>
            </div>
            <div class="icono-item audio-btn">
                <button id="btn-nav4"><img src="./src/volume-icon.webp" alt="icono"></button>
                <span class="text-font">Con Efectos de sonido</span>
            </div>
        </div>
    </nav>
    <!-- MODAL PERSONALIZACIÓN -->
    <section class="modal-config custom-oculto" id="modal-config">
        <div class="modal-contenido">
            <div class="personalizacion-title">
                <h2>Personalización</h2>
                <p>Completa todos los minijuegos para desbloquear nuevos personajes.</p>
            </div>
            <div class="customCards">
                <div class="customCard" id="customCard-a" data-value="A" data-default-src="./src/chars-a01.webp"
                    data-selected-src="./src/chars-a03.webp">
                    <img src="" alt="" class="customCard-img" id="customCard-a-img">
                </div>

                <!-- Se añade la clase 'bloqueado' y el span de texto -->
                <div class="customCard bloqueado" id="customCard-b" data-value="B"
                    data-default-src="./src/chars-b01.webp" data-selected-src="./src/chars-b03.webp">
                    <img src="" alt="" class="customCard-img" id="customCard-b-img">
                    <span class="texto-bloqueado">Bloqueado</span>
                </div>

                <!-- Se añade la clase 'bloqueado' y el span de texto -->
                <div class="customCard bloqueado" id="customCard-c" data-value="C"
                    data-default-src="./src/chars-c01.webp" data-selected-src="./src/chars-c03.webp">
                    <img src="" alt="" class="customCard-img" id="customCard-c-img">
                    <span class="texto-bloqueado">Bloqueado</span>
                </div>
            </div>
            <div>
                <button class="btn-entendido text-font" id="btn-confirmar-modal">CONFIRMAR</button>
            </div>
        </div>
    </section>
    <main>
        <!-- MENÚ PRINCIPAL -->
        <section class="menu-juegos activo" id="menu-juegos">
            <!-- Contenedor para la notificación -->
            <div id="notificacion-desbloqueo" class="notificacion-msj"></div>

            <button class="btn-nav2b" id="btn-nav2b">
                <img src="./src/icon-a.webp" id="icon-custom" alt="icono">
            </button>
            <div class="juegos-contenido">
                <h2>MINIJUEGOS</h2>
                <div class="juegos-grid">
                    <button class="juego-item">
                        <img src="" id="main-miniatura-a" alt="minijuego de alimentos">
                    </button>
                    <button class="juego-item">
                        <img src="" id="main-miniatura-b" alt="minijuego de higiene">
                    </button>
                    <button class="juego-item">
                        <img src="" id="main-miniatura-c" alt="minijuego de enfermedades">
                    </button>
                    <button class="juego-item">
                        <img src="" id="main-miniatura-d" alt="minijuego de salud fisica y emocional">
                    </button>
                </div>
            </div>
        </section>

        <!-- CANVAS -->
        <section class="canvas-box oculto">
            <canvas id="game"></canvas>
        </section>

        <!-- INSTRUCCIONES -->
        <section class="instrucciones" id="instrucciones-box">
            <div id="instrucciones-card">
                <div class="instrucciones-title">
                    <h2>Instrucciones</h2>
                    <p>Aprende a jugar siguiendo estos pasos</p>
                </div>

                <div id="card-info">
                    <img src="./src/game-c/bug01.webp" alt="Personajes" id="card-img-character">

                    <div id="card-info-leftside">
                        <video src="" id="card-img-tutorial" autoplay muted loop playsinline preload="auto"></video>
                        <div class="text-font" id="card-text">
                            <div id="card-step-box">
                                <div id="step-circle">01</div>
                                <div id="step-content">
                                    <p id="card-description">
                                        ...
                                    </p>
                                </div>
                            </div>
                        </div>
                        <div id="card-btns">
                            <button class="card-btn text-font" id="btn-anterior">ANTERIOR</button>
                            <button class="card-btn text-font" id="btn-siguiente">SIGUIENTE</button>
                            <button class="card-btn text-font" id="btn-entendido">¡A JUGAR!</button>
                        </div>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <script type="module" src="js/audio-btns.js"></script>
    <script type="module" src="js/menu.js"></script>
    <script type="module" src="js/navbar.js"></script>
    <script type="module" src="js/instrucciones.js"></script>
</body>

</html>
